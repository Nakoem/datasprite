logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: ${oc.env:DB_HOST,localhost}
  port: ${oc.env:DB_PORT,3306}
  user: ${oc.env:DB_USER}
  password: ${oc.env:DB_PASSWORD}
  database: meta

db_dw:
  host: ${oc.env:DB_HOST,localhost}
  port: ${oc.env:DB_PORT,3306}
  user: ${oc.env:DB_USER}
  password: ${oc.env:DB_PASSWORD}
  database: dw

qdrant:
  host: ${oc.env:QDRANT_HOST,localhost}
  port: ${oc.env:QDRANT_PORT,6333}
  embedding_size: 1024

embedding:
  host: ${oc.env:EMBEDDING_HOST,localhost}
  port: ${oc.env:EMBEDDING_PORT,8081}
  model: BAAI/bge-large-zh-v1.5

redis:
  host: ${oc.env:REDIS_HOST,localhost}
  port: ${oc.env:REDIS_PORT,6380}

es:
  host: ${oc.env:ES_HOST,localhost}
  port: ${oc.env:ES_PORT,9201}
  index_name: data_agent

llm:
  model_name: qwen3.7-max-2026-05-20
  api_key: ${oc.env:LLM_API_KEY}
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # LLM 容错：单次请求超时 + 自动重试 + 降级模型
  request_timeout: 60
  max_retries: 3
  fallback_model: qwen-plus
  # 整条 query_sync 管线超时（秒），防 LLM 假死挂起
  query_timeout: 120

jwt:
  # 登录鉴权密钥，从 .env 注入；未配置时用开发默认值
  secret: ${oc.env:JWT_SECRET,datasprite-dev-secret-change-me}
  algorithm: HS256
  access_token_expire_minutes: 60

rate_limit:
  enable: true
  # 豁免路径前缀：探活 / 监控 / 文档不限流
  exempt_paths:
    - /health
    - /metrics
    - /docs
    - /redoc
    - /openapi.json
  # 普通接口：每 IP 一个桶
  per_ip:
    capacity: 30
    refill_rate: 10
  # /api/query 收紧档：背后是多次 LLM 调用，又贵又慢
  per_ip_query:
    capacity: 5
    refill_rate: 0.5
  # 全局桶：所有请求共享的总闸，防分布式刷量烧穿 LLM 账单
  global_bucket:
    capacity: 100
    refill_rate: 50
